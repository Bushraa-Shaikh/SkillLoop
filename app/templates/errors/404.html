{% extends "base.html" %}
{% block title %}404 Not Found{% endblock %}
{% block content %}
<div style="min-height:70vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem;">
  <div>
    <div style="font-size:5rem;margin-bottom:1rem;">🔍</div>
    <h1 style="font-size:3rem;color:var(--teal);margin-bottom:1rem;">404</h1>
    <h2 style="margin-bottom:1rem;">Page Not Found</h2>
    <p style="max-width:400px;margin:0 auto 2rem;">The page you're looking for doesn't exist or has been moved.</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-lg">← Back to Home</a>
  </div>
</div>
{% endblock %}
