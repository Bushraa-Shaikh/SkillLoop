{% extends "base.html" %}
{% block title %}Edit Gig{% endblock %}
{% block content %}
<div class="page-wrap">
  <div class="container" style="max-width:800px;">
    <div class="page-hdr"><h2>✏️ Edit Gig</h2></div>
    <div class="card">
      <div class="card-body">
        <form method="POST">
          <div class="form-group">
            <label class="form-label">Title<span class="req">*</span></label>
            <input type="text" name="title" class="form-control" value="{{ gig.title }}" required maxlength="200"/>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Category</label>
              <select name="category" class="form-control">
                {% for c in categories %}
                <option value="{{ c }}" {% if gig.category==c %}selected{% endif %}>{{ c }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Price (Coins)</label>
              <input type="number" name="price" class="form-control" value="{{ gig.price|int }}" min="0"/>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Description<span class="req">*</span></label>
            <textarea name="description" class="form-control" rows="6" required maxlength="2000">{{ gig.description }}</textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Delivery Days</label>
              <input type="number" name="delivery_days" class="form-control" value="{{ gig.delivery_days }}" min="1"/>
            </div>
            <div class="form-group">
              <label class="form-label">Revisions</label>
              <input type="number" name="revisions" class="form-control" value="{{ gig.revisions }}" min="0"/>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Tags</label>
            <input type="text" name="tags" class="form-control" value="{{ gig.tags or '' }}"/>
          </div>
          <div class="form-group">
            <label class="form-check">
              <input type="checkbox" name="allow_swap" {% if gig.allow_swap %}checked{% endif %}/>
              <span>Accept Skill Swap</span>
            </label>
          </div>
          <div style="display:flex;gap:1rem;">
            <button type="submit" class="btn btn-primary">💾 Save Changes</button>
            <a href="{{ url_for('gigs.seller_gigs') }}" class="btn btn-ghost">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
