
{% extends "base.html" %}
{% block title %}Leave a Review{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo"><div class="auth-logo-text">⭐ Leave a Review</div></div>
    <h2 class="auth-title">How was it?</h2>
    <p class="auth-sub">Review: {{ order.gig_title }}</p>
    <form method="POST">
      <div class="form-group">
        <label class="form-label">Rating<span class="req">*</span></label>
        <div class="star-picker" data-input="rating-val" style="display:flex;gap:.5rem;font-size:2rem;cursor:pointer;justify-content:center;margin:1rem 0;">
          {% for i in range(5) %}<span class="pick-star" style="transition:transform .1s;" onmouseover="this.style.transform='scale(1.2)'" onmouseout="this.style.transform='scale(1)'">☆</span>{% endfor %}
        </div>
        <input type="hidden" name="rating" id="rating-val" value="0"/>
      </div>
      <div class="form-group">
        <label class="form-label">Comment</label>
        <textarea name="comment" class="form-control" rows="4" placeholder="Share your experience with this seller…" maxlength="500"></textarea>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">Submit Review →</button>
      <a href="{{ url_for('dashboard.index') }}" class="btn btn-ghost btn-block mt1">Skip for now</a>
    </form>
  </div>
</div>
{% endblock %}
